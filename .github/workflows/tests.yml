# The tests the README lists, on Linux, for every pull request and for main.
# Each is standalone and brings its own stand-ins, so they are run one after
# another and every one is run: a failure in one does not hide the next.
#
# Python is the runner's own (/usr/bin/python3), and not one that
# setup-python would put under /opt/hostedtoolcache: douglas/test_douglas_work.py
# runs a job behind the kernel's real fence, and a job may run what the system
# has in its usual places and nothing else.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run every test
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          failed=()
          run() {
              echo "::group::$*"
              if "$@"; then echo "::endgroup::"; echo "ok    $*"
              else echo "::endgroup::"; echo "::error::failed: $*"; failed+=("$*"); fi
          }
          for t in tests/test_*.sh; do run bash "$t"; done
          for t in pi/deck-api/test_*.py douglas/test_*.py dougvoice/test_*.py dougring/test_*.py; do
              [ -e "$t" ] && run python3 "$t"
          done
          echo
          if [ "${#failed[@]}" -gt 0 ]; then
              echo "${#failed[@]} failed:"; printf '  %s\n' "${failed[@]}"; exit 1
          fi
          echo "all passed"
